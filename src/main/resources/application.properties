spring.application.name=library-management-system

# Run on port 8090
server.port=8090

# SQLite database — stored inside the project directory
spring.datasource.url=jdbc:sqlite:./library.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Disable Spring Boot's auto DataSource/JPA config (we use plain JDBC)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Logging
logging.level.com.niranjan=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.web.servlet=DEBUG
